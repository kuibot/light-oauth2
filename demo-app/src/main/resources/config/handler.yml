# Handler configuration
---
enabled: true

handlers:
  - com.networknt.oauth.demo.handler.TokenExchangeHandler@token-exchange

paths:
  - path: '/authorize'
    method: 'post'
    exec:
      - token-exchange
  - path: '/user/info'
    method: 'GET'
    handler: 'com.networknt.oauth.demo.handler.UserInfoHandler'
